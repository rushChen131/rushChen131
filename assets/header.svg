      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f4f8fc" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8c4cf" />
    </marker>
  </defs>

  <rect width="1280" height="320" fill="#ffffff" />
  <rect x="0" y="0" width="1280" height="4" fill="#0969da" opacity="0.9" />

  <!-- 左侧：身份 -->
  <text x="64" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="2.4" fill="#8b949e">GITHUB.COM/RUSHCHEN131</text>
  <text x="64" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="46" font-weight="600" letter-spacing="-1" fill="#1f2328">Hi, I&#39;m frank</text>
  <text x="64" y="190" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#3d444d">后端 / AI 应用工程</text>
  <text x="64" y="218" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" letter-spacing="0.4" fill="#6b7280">Python · FastAPI · LLM 应用 · PostgreSQL &#43; pgvector</text>

  <circle cx="70" cy="254" r="4" fill="#1a7f37" />
