  <rect x="592" y="44" width="624" height="232" rx="14" fill="url(#panel)" stroke="#e3e8ee" />
  <text x="616" y="76" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8b949e">PERSONALOS · 数据流</text>

  <!-- A: Journal -->
  <rect x="616" y="120" width="124" height="52" rx="9" fill="#ffffff" stroke="#d8dee4" />
  <text x="678" y="143" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">Journal</text>
  <text x="678" y="160" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10.5" fill="#6b7280">唯一手写输入</text>

  <!-- A -> B -->
  <line x1="746" y1="146" x2="780" y2="146" stroke="#b8c4cf" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- B: JournalCreated -->
  <rect x="786" y="120" width="176" height="52" rx="9" fill="#ffffff" stroke="#d8dee4" />
  <text x="874" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1f2328">JournalCreated</text>
  <text x="874" y="160" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="10.5" fill="#6b7280">event bus</text>

  <!-- B -> C branch -->
  <line x1="962" y1="146" x2="1006" y2="146" stroke="#b8c4cf" stroke-width="1.5" />
  <line x1="1006" y1="91" x2="1006" y2="215" stroke="#b8c4cf" stroke-width="1.5" />
  <line x1="1006" y1="91" x2="1022" y2="91" stroke="#b8c4cf" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="1006" y1="153" x2="1022" y2="153" stroke="#b8c4cf" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="1006" y1="215" x2="1022" y2="215" stroke="#b8c4cf" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- C chips -->
  <rect x="1030" y="70" width="160" height="42" rx="8" fill="#ffffff" stroke="#d8dee4" />
  <text x="1110" y="95" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#1f2328">向量化 Embedding</text>

  <rect x="1030" y="132" width="160" height="42" rx="8" fill="#ffffff" stroke="#d8dee4" />
  <text x="1110" y="157" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#1f2328">记忆蒸馏 Memory</text>

  <rect x="1030" y="194" width="160" height="42" rx="8" fill="#ffffff" stroke="#d8dee4" />
  <text x="1110" y="219" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11.5" fill="#1f2328">周期报告 Report</text>

  <text x="616" y="256" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11" fill="#8b949e">Agent 只经由带权限校验的工具访问数据</text>
